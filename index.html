<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prototipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#1546C8;--brand-strong:#0E3596;--brand-soft:#E5ECFB;--on-brand:#FFFFFF;
  --ink:#0F1B2D;--ink-2:#46566C;--ink-3:#77869B;--line:#D9E1EB;
  --bg:#E4EAF2;--surface:#FFFFFF;--surface-2:#F3F6FA;
  --ok:#0B7F4F;--ok-soft:#DDF3E8;--warn:#94570A;--warn-soft:#FFF0D2;--bad:#B42828;--bad-soft:#FBE2E2;
  --signal:#F0A400;--frame:#0F1B2D;
  --map-land:#EEF1EA;--map-water:#CFE0F2;--map-line:#D3DACB;--map-river:#A9C6E6;--map-route:#BCC6D4;
  --r-lg:22px;--r-md:16px;--r-sm:10px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#6B97FF;--brand-strong:#9DB9FF;--brand-soft:#1A2A4D;--on-brand:#06122B;
  --ink:#EEF3FA;--ink-2:#B3C0D3;--ink-3:#8593A8;--line:#26354D;
  --bg:#060B15;--surface:#101B2D;--surface-2:#0B1424;
  --ok:#4CD394;--ok-soft:#10362A;--warn:#F2B347;--warn-soft:#3A2A0C;--bad:#FF8080;--bad-soft:#3E1717;
  --signal:#FFB627;--frame:#000;
  --map-land:#15223A;--map-water:#0C1E3B;--map-line:#1F3049;--map-river:#24497A;--map-route:#33466A;
}}
:root[data-theme="dark"]{
  --brand:#6B97FF;--brand-strong:#9DB9FF;--brand-soft:#1A2A4D;--on-brand:#06122B;
  --ink:#EEF3FA;--ink-2:#B3C0D3;--ink-3:#8593A8;--line:#26354D;
  --bg:#060B15;--surface:#101B2D;--surface-2:#0B1424;
  --ok:#4CD394;--ok-soft:#10362A;--warn:#F2B347;--warn-soft:#3A2A0C;--bad:#FF8080;--bad-soft:#3E1717;
  --signal:#FFB627;--frame:#000;
  --map-land:#15223A;--map-water:#0C1E3B;--map-line:#1F3049;--map-river:#24497A;--map-route:#33466A;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;font-size:16px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* Barra de demo (fuera de la app) */
.demo-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.demo-bar .tag{font-weight:600}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.linkbtn{border:0;background:none;color:var(--brand);font-weight:600;font-size:13px;padding:6px}

.stage{flex:1;display:flex;justify-content:center;align-items:flex-start;min-height:0}
.phone{position:relative;width:100%;max-width:440px;height:100%;background:var(--surface-2);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:640px){
  .stage{padding:4px 0 20px}
  .phone{width:392px;height:min(830px,calc(100vh - 80px));border-radius:44px;border:11px solid var(--frame);box-shadow:0 40px 80px -30px rgba(15,27,45,.55)}
}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:16px}
.stack>*+*{margin-top:12px}

/* Tipografía */
h1,h2,h3{margin:0;letter-spacing:-.015em}
.h1{font-size:28px;font-weight:800;line-height:1.15}
.h2{font-size:21px;font-weight:700;line-height:1.25}
.h3{font-size:17px;font-weight:700}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3);font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.hdr{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:6px;min-height:58px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr .t{flex:1;font-weight:700;font-size:17px;padding-left:4px}
.hdr .t small{display:block;font-weight:500;font-size:12px;color:var(--ink-3)}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink)}
.iconbtn:active{background:var(--surface-2)}

/* Botones */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:0 20px;border-radius:16px;border:0;font-weight:700;font-size:17px;text-decoration:none;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-secondary{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.btn-ok{background:var(--ok);color:#fff}
.btn-sm{min-height:44px;font-size:15px;border-radius:12px;padding:0 14px;width:auto}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1}

/* Tarjetas y piezas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}
button.card{display:block;width:100%;text-align:left}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.b-neutral{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.b-brand{background:var(--brand-soft);color:var(--brand-strong)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-bad{background:var(--bad-soft);color:var(--bad)}
.dotlive{width:8px;height:8px;border-radius:50%;background:currentColor}
.route{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px}
.route .arrow{color:var(--ink-3);font-weight:500}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:15px}
.kv dt{color:var(--ink-2)}
.kv dd{margin:0;text-align:right;font-weight:600;overflow-wrap:anywhere}
.divider{height:1px;background:var(--line);margin:12px 0}
.section-t{font-size:15px;font-weight:700;color:var(--ink-2);margin:20px 0 8px}
.avatar{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand-strong);font-weight:800}
.avatar.lg{width:64px;height:64px;border-radius:20px;font-size:22px}
.mini-steps{display:flex;gap:4px;margin-top:12px}
.mini-steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.mini-steps i.on{background:var(--brand)}
.mini-steps.ok i.on{background:var(--ok)}

/* Formularios */
.field{display:block}
.field>span{display:block;font-size:14px;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.input{width:100%;min-height:52px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
textarea.input{min-height:84px;resize:vertical}
.input:focus{border-color:var(--brand);outline:none}
.hint{font-size:13px;margin-top:6px;color:var(--ink-3)}
.hint.ok{color:var(--ok)}.hint.bad{color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ctsel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ctsel button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:15px}
.ctsel button small{font-weight:500;font-size:12px;color:var(--ink-3)}
.ctsel button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-strong)}
.ctsel svg.cont{width:100%;max-width:74px;height:30px}
.errbox{background:var(--bad-soft);color:var(--bad);padding:12px 14px;border-radius:12px;font-size:14px;font-weight:600}
.note{background:var(--surface-2);border:1px dashed var(--line);padding:12px 14px;border-radius:12px;font-size:13px;color:var(--ink-2)}

/* Chips de filtro */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px}
.chip{flex:none;border:1.5px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}

/* Tab bar */
.tabbar{display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:4px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 6px;border:0;background:transparent;color:var(--ink-3);font-size:12px;font-weight:600}
.tabbar button[aria-current="page"]{color:var(--brand)}

/* Mapa simulado */
.map{position:relative;overflow:hidden;background:var(--map-land)}
.map svg{display:block;width:100%;height:100%}
.map-note{position:absolute;left:10px;bottom:8px;font-size:11px;color:var(--ink-3);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:2px 8px;border-radius:6px}
.m-water{fill:var(--map-water)}
.m-ridge{fill:none;stroke:var(--map-line);stroke-width:1.2;stroke-dasharray:2 4}
.m-river{fill:none;stroke:var(--map-river);stroke-width:1.6}
.m-route-base{fill:none;stroke:var(--map-route);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.m-route-done{fill:none;stroke:var(--brand);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;transition:stroke-dashoffset 1s linear}
.m-city{fill:var(--surface);stroke:var(--ink-3);stroke-width:1.5}
.m-city-on{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.m-label{font-size:9.5px;fill:var(--ink-3);font-weight:600;font-family:inherit}
.m-label.on{fill:var(--ink);font-weight:800;font-size:10.5px}
.m-sea{font-size:8px;fill:var(--ink-3);font-style:italic;opacity:.8}
.m-truck-g{transition:transform 1s linear}
.m-halo{fill:var(--signal);opacity:.25;transform-box:fill-box;transform-origin:center;animation:halo 1.8s ease-out infinite}
.m-truck{fill:var(--signal);stroke:var(--ink);stroke-width:1.4}
@keyframes halo{0%{transform:scale(.6);opacity:.45}100%{transform:scale(1.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.m-halo{animation:none}.m-route-done,.m-truck-g{transition:none}}

/* Panel flotante sobre el mapa */
.over{margin:-28px 12px 0;position:relative;z-index:2}
.eta{font-size:30px;font-weight:800;letter-spacing:-.02em}
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ok)}
.live.off{color:var(--ink-3)}

/* Stepper */
.stepper{list-style:none;margin:0;padding:0}
.stepper li{position:relative;display:flex;gap:14px;padding-bottom:18px}
.stepper li:last-child{padding-bottom:0}
.stepper li::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.stepper li:last-child::before{display:none}
.stepper li.done::before{background:var(--brand);width:3px;left:12.5px}
.stepper .dot{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--surface);color:var(--on-brand)}
.stepper li.done .dot{background:var(--brand);border-color:var(--brand)}
.stepper li.now .dot{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.stepper li.now .dot::after{content:"";width:10px;height:10px;border-radius:3px;background:var(--brand)}
.stepper li.final .dot{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:none}
.stepper li.final .dot::after{display:none}
.stepper b{display:block;font-size:15px}
.stepper small{color:var(--ink-3);font-size:13px}
.stepper li.todo b{color:var(--ink-3);font-weight:600}

/* Evidencias */
.evgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.evtile{display:block;width:100%;padding:0;border:1.5px dashed var(--line);background:var(--surface);border-radius:14px;overflow:hidden;text-align:left}
.evtile .ph{display:grid;place-items:center;aspect-ratio:4/3;color:var(--ink-3);gap:4px;font-size:13px;font-weight:600}
.evtile.has{border-style:solid}
.evtile .ph svg.photo{width:100%;height:100%}
.evtile .meta{padding:8px 10px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line)}
.evtile .meta b{display:block;color:var(--ink);font-size:13px}

/* Historial */
.timeline{list-style:none;margin:0;padding:0}
.timeline li{padding:14px 0;border-bottom:1px solid var(--line)}
.timeline li:last-child{border-bottom:0}

/* Ofertas */
.offer .price{font-size:22px;font-weight:800;letter-spacing:-.02em}
.stars{color:var(--signal);font-weight:700}

/* Sheet y toast */
.scrim{position:absolute;inset:0;background:rgba(6,11,21,.5);z-index:20;display:flex;align-items:flex-end;animation:fade .15s ease-out}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px 22px;animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.toast{position:absolute;left:12px;right:12px;bottom:78px;z-index:30;display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--surface);padding:14px 16px;border-radius:16px;font-weight:600;font-size:15px;animation:up .2s ease-out}
.urlbox{font-size:13px;word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:12px;border:1.5px solid var(--line);font-weight:600;font-size:15px}
.check input{width:22px;height:22px;margin:0;accent-color:var(--brand)}

/* Splash y rol */
.splash{flex:1;display:flex;flex-direction:column;justify-content:space-between;background:var(--brand);color:var(--on-brand);padding:56px 28px 36px;border:0;text-align:left;width:100%}
.splash .name{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1}
.splash .tl{font-size:18px;opacity:.9;max-width:16em;margin-top:12px}
.rolecard{display:flex;gap:16px;align-items:flex-start;width:100%;text-align:left;padding:20px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface)}
.rolecard:active{border-color:var(--brand)}
.rolecard .ico{flex:none;display:grid;place-items:center;width:56px;height:56px;border-radius:16px;background:var(--brand-soft);color:var(--brand-strong)}
.rolecard b{display:block;font-size:19px;line-height:1.25;margin-bottom:4px}

/* Ingresos */
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:14px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{width:100%;border-radius:6px 6px 2px 2px;background:var(--brand-soft);min-height:3px}
.bars i.cur{background:var(--brand)}
.bars span{font-size:11px;color:var(--ink-3);font-weight:600}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat3 .card{padding:12px}
.stat3 b{display:block;font-size:20px;font-weight:800}
.stat3 span{font-size:12px;color:var(--ink-2)}
.menu{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.menu button,.menu .mi{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:10px 16px;border:0;background:transparent;text-align:left;font-weight:600;font-size:15px;border-bottom:1px solid var(--line)}
.menu>:last-child{border-bottom:0}
.menu .grow{flex:1}
.banner{display:flex;gap:12px;align-items:center;width:100%;text-align:left;margin:12px 16px 0;width:calc(100% - 32px);padding:14px 16px;border-radius:16px;border:0;background:var(--brand);color:var(--on-brand);font-weight:700}
.empty{text-align:center;padding:36px 20px;color:var(--ink-2)}
.empty .ico{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:20px;background:var(--surface);border:1px solid var(--line);color:var(--ink-3);margin-bottom:12px}
.stars-in{display:flex;gap:6px}
.stars-in button{border:0;background:none;padding:4px;color:var(--line)}
.stars-in button.on{color:var(--signal)}
.stars-in svg{fill:currentColor}

/* ===== Panel admin ===== */
#admin{display:none;position:relative;flex:1;min-height:0;background:var(--surface-2);border-top:1px solid var(--line)}
body.is-admin .stage{display:none}
body.is-admin #admin{display:flex}
#admin-view{display:flex;flex:1;min-height:0;min-width:0}
.a-side{width:228px;flex:none;background:var(--surface);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.a-brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;padding:4px 10px 18px}
.a-nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;border:0;background:none;font-weight:600;font-size:15px;color:var(--ink-2);text-align:left;width:100%}
.a-nav:hover{background:var(--surface-2)}
.a-nav[aria-current="page"]{background:var(--brand-soft);color:var(--brand-strong)}
.a-nav .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:12px;border-radius:999px;padding:1px 8px}
.a-main{flex:1;min-width:0;overflow-y:auto;padding:0 28px 32px}
.a-top{padding:24px 0 16px}
.md{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:18px;align-items:start}
.a-list{display:flex;flex-direction:column;gap:8px}
.a-item{display:block;width:100%;text-align:left;font-size:14px}
.a-item.sel{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.a-back{display:none;margin-bottom:8px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{text-align:left}
.kpi b{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em}
.kpi span{color:var(--ink-2);font-size:14px}
.chk header{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.chk .n{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);font-weight:800;font-size:14px}
.docs{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
.docrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.docrow:last-child{border-bottom:0}
.docrow .grow{flex:1}
.docrow .ic{flex:none;color:var(--ink-3)}
.docrow.good .ic{color:var(--ok)}.docrow.warn .ic{color:var(--bad)}
.grid2a{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.thread{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.msg{padding:10px 12px;border-radius:12px;background:var(--surface-2);max-width:88%;font-size:14px}
.msg.staff{background:var(--brand-soft);margin-left:auto}
.msg .faint{font-size:12px;margin-bottom:2px}
.conn{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.conn .card{display:flex;flex-direction:column;gap:8px}
.conn .card p{margin:0;font-size:14px;color:var(--ink-2);flex:1}
pre.code{margin:0;padding:14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#admin .scrim{align-items:center;justify-content:center;padding:16px}
#admin .sheet{max-width:560px;border-radius:20px;max-height:90%}
#admin .sheet .grab{display:none}
#admin .toast{left:auto;right:20px;bottom:20px;max-width:440px}
@media (max-width:900px){
  #admin-view{flex-direction:column}

.btn-danger{background:var(--bad);color:#fff}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface)}
.opt .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.opt[aria-pressed="true"] .rd{border-color:var(--brand);background:radial-gradient(var(--brand) 45%,transparent 50%)}
.opt .grow{flex:1}
.pin{display:flex;gap:10px;justify-content:center;margin:12px 0}
.pin span{width:52px;height:64px;display:grid;place-items:center;border-radius:14px;background:var(--brand-soft);color:var(--brand-strong);font-size:32px;font-weight:800;font-variant-numeric:tabular-nums}
.geo{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:14px}
.geo.in{background:var(--ok-soft);color:var(--ok)}
.switch{flex:none;width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0}
.switch i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"] i{transform:translateX(22px)}
.screen.chat{display:flex;flex-direction:column;gap:8px;padding:12px 14px}

.bub .faint{font-size:11px;margin-bottom:2px;color:inherit;opacity:.75}
.chatph{width:150px;margin-bottom:6px;border-radius:10px;overflow:hidden}
.chatin{padding:10px 12px;background:var(--surface);border-top:1px solid var(--line)}
.chatin .input{min-height:46px}
.alertcard.bad{border-left:5px solid var(--bad)}
.alertcard.warn{border-left:5px solid var(--signal)}
.tabbar button{font-size:11px}

};
const ic=(n,s=22)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- Catálogos ----------
// Piloto: Buenaventura → Bogotá y Cali. Coordenadas aproximadas, solo demostración.
const PLACES={
 SPB:{name:'Sociedad Portuaria de Buenaventura',short:'Sociedad Portuaria',city:'Buenaventura',cc:'BUN',lat:3.8876,lng:-77.0760,x:60,y:196},
 SPA:{name:'Sociedad Portuaria Aguadulce',short:'Aguadulce',city:'Buenaventura',cc:'BUN',lat:3.8848,lng:-77.0627,x:62,y:194},
 TCB:{name:'Terminal de Contenedores de Buenaventura',short:'TCBuen',city:'Buenaventura',cc:'BUN',lat:3.8890,lng:-77.0792,x:58,y:198},
 BOG:{name:'Bodega Fontibón, Bogotá',city:'Bogotá',cc:'BOG',lat:4.6782,lng:-74.1469,x:214,y:152,patio:'Patio de naviera, Fontibón (Bogotá)'},
 CLO:{name:'Bodega Yumbo, Cali',city:'Cali',cc:'CLO',lat:3.5833,lng:-76.4950,x:91,y:213,patio:'Patio de naviera, Yumbo (Cali)'},
};
const ORIGINS=['SPB','SPA','TCB'], DESTS=['BOG','CLO'];
const MAPCITIES=[{c:'Buenaventura',x:60,y:196,dx:-3,dy:-9,a:'start',cc:'BUN'},{c:'Cali',x:91,y:213,dx:7,dy:4,a:'start',cc:'CLO'},{c:'Bogotá',x:214,y:152,dx:7,dy:4,a:'start',cc:'BOG'},{c:'Medellín',x:120,y:126,dx:7,dy:4,a:'start'},{c:'Barranquilla',x:150,y:31,dx:7,dy:4,a:'start'},{c:'Cartagena',x:112,y:45,dx:-7,dy:4,a:'end'}];
const KM={'BUN-BOG':510,'BUN-CLO':120};
const CT={'20ST':{label:"20' Standard",short:"20'",rate:6200,len:.62},'40ST':{label:"40' Standard",short:"40'",rate:7400,len:1},'40HC':{label:"40' High Cube",short:"40' HC",rate:7900,len:1,hc:true}};
// Cierre nocturno de la vía Buga–Buenaventura (reportado por Analdex tras el sismo del 10-ago-2026). Confirmar estado actual.
const CLOSURE={on:true,from:20,to:6};
const GEO=0.3; // radio de geocerca en km
const COMM=0.10; // comisión de la plataforma
const WAIT={free:3,rate:90000}; // horas libres de espera en bodega y tarifa por hora (supuesto)
const DRIVERS=[
 {id:'d1',name:'Andrés Molina',carrier:'Transportes Ceiba del Pacífico',rating:4.9,trips:312,plate:'TBN-482',vehicle:'Tractocamión 2019, 3 ejes',factor:1.0,speed:55,tag:'Mejor calificado',phone:'300 000 0482',dist:9},
 {id:'d2',name:'Yesenia Ruiz',carrier:'Ruta Andina Logística',rating:4.7,trips:198,plate:'TBN-317',vehicle:'Tractocamión 2017, 2 ejes',factor:0.92,speed:50,tag:'Menor precio',phone:'300 000 0317',dist:18},
 {id:'d3',name:'Hernán Quintero',carrier:'Cargas El Alcaraván',rating:4.8,trips:540,plate:'TBN-905',vehicle:'Tractocamión 2021, 3 ejes',factor:1.07,speed:60,tag:'Más cercano al puerto',phone:'300 000 0905',dist:4},
];
const CLIENT={name:'Laura Pineda',company:'Comercializadora Brisa Atlántica S.A.S.',nit:'900.000.123-4',email:'laura@brisa-atlantica.example',phone:'301 000 0000'};
const STEPS=['SOLICITADO','ASIGNADO','EN_PUERTO','RECOGIDO','EN_TRANSITO','ENTREGADO','DEVUELTO'];
const ST={
 SOLICITADO:{label:'Solicitado',hint:'Solicitud creada'},
 ASIGNADO:{label:'Asignado',hint:'Un conductor acepta el servicio'},
 EN_PUERTO:{label:'En puerto',hint:'Llegada al terminal, con selfie'},
 RECOGIDO:{label:'Recogido',hint:'Contenedor cargado, con PIN de retiro'},
 EN_TRANSITO:{label:'En tránsito',hint:'Rumbo al destino'},
 ENTREGADO:{label:'Entregado',hint:'Entrega con PIN, foto y geocerca'},
 DEVUELTO:{label:'Vacío devuelto',hint:'Contenedor vacío entregado con comprobante'},
 CANCELADO:{label:'Cancelado',hint:''},
};
const EVL={SELFIE:'Selfie de llegada',RECOGIDA:'Contenedor recogido',ENTREGA:'Entrega',VACIO:'Devolución del vacío'};
const SEG={
 todo:{name:'Todo riesgo, deducible bajo',rate:.004,ded:'1 %',cov:'Pérdida total o parcial por robo, volcamiento, colisión, incendio y daños.'},
 todo5:{name:'Todo riesgo, deducible alto',rate:.0028,ded:'5 %',cov:'Misma cobertura con prima menor y deducible más alto.'},
 nom:{name:'Riesgos nombrados',rate:.002,ded:'10 %',cov:'Solo robo, volcamiento, colisión e incendio.'},
};
const PAYM=[['card','Tarjeta de crédito o débito','card'],['pse','PSE (débito desde tu banco)','bank'],['nequi','Nequi','phone'],['qr','Código QR','qr']];
const KYC=[ // documento, básico, completo
 ['RUT (menor a 30 días)',1,1],['Cámara de Comercio (menor a 30 días)',1,1],['Cédula del representante legal, con selfie',1,1],
 ['Autorización de tratamiento de datos (Ley 1581), firma electrónica',1,1],['Acuerdo de seguridad, firma electrónica',1,1],
 ['Conocimiento del cliente (Circular 170)',1,1],['Visita virtual: fotos geolocalizadas de fachada y oficina',1,0],['Visita virtual: videollamada con el representante',0,1],
 ['Consulta automática en listas restrictivas',1,1],['Referencias comercial y bancaria',0,1],['Estados financieros y declaración de renta',0,1]];

// ---------- Utilidades ----------
const now=()=>Date.now(); const MIN=60e3, HR=36e5, DAY=864e5;
const cop=n=>'$'+Math.round(n).toLocaleString('es-CO');
const fmtT=t=>new Date(t).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});
const fmtD=t=>new Date(t).toLocaleDateString('es-CO',{day:'numeric',month:'short'});
const fmtDT=t=>fmtD(t)+', '+fmtT(t);
const ago=t=>{const s=Math.max(0,Math.round((now()-t)/1000)); return s<60?`hace ${s} s`:s<5400?`hace ${Math.round(s/60)} min`:`hace ${Math.round(s/3600)} h`;};
const dur=h=>{const hh=Math.floor(h), mm=Math.round((h-hh)*60); return hh?`${hh} h ${mm} min`:`${mm} min`;};
const rk=t=>PLACES[t.o].cc+'-'+PLACES[t.d].cc;
const kmOf=t=>KM[rk(t)];
const isoDate=d=>new Date(d).toISOString().slice(0,10);
const initials=n=>n.split(' ').map(w=>w[0]).slice(0,2).join('');
const drv=id=>DRIVERS.find(d=>d.id===id)||DRIVERS[0];
const roundK=n=>Math.round(n/10000)*10000;
const pinOf=(id,k)=>String(1000+((parseInt(id.slice(3))*(k?6151:4871))%9000));

// ISO 6346: dígito de control del número de contenedor
function isoCheck(code){const m={};let v=10;for(const ch of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'){if(v%11===0)v++;m[ch]=v;v++;}
 let s=0;for(let i=0;i<10;i++){const c=code[i];s+=(/\d/.test(c)?+c:m[c])*Math.pow(2,i);}return (s%11)%10;}
function checkContainer(raw){const s=String(raw||'').replace(/[\s-]/g,'').toUpperCase();
 if(!s) return {ok:false,msg:'Escribe el número del contenedor'};
 if(!/^[A-Z]{3}[UJZ]\d{7}$/.test(s)) return {ok:false,msg:'Formato: 4 letras + 7 dígitos (ej. TBNU4829151)'};
 const d=isoCheck(s.slice(0,10)); return d===+s[10]?{ok:true,msg:'Número válido según ISO 6346'}:{ok:false,msg:`El dígito de control no coincide (debería ser ${d})`};}
function genContainer(seed){const six=String(100000+((seed*7919)%900000)).slice(0,6);const b='TBNU'+six;return b+isoCheck(b);}

// ---------- Tarifas, ETA y cierre nocturno ----------
function fleteBase(t){return Math.max(1200000,roundK(kmOf(t)*CT[t.ct].rate));}
const vacioFee=t=>t.vacio==='patio'?420000:roundK(kmOf(t)*1800);
const plazoFee=t=>t.plazo==='expres'?300000:0;
function prima(t){return Math.max(150000,Math.round(t.seg.cif*SEG[t.seg.plan].rate/1000)*1000);}
function quote(t,d){const flete=roundK(fleteBase(t)*d.factor),vac=vacioFee(t),pz=plazoFee(t),pr=prima(t),serv=flete+vac+pz,com=Math.round(serv*COMM);
 return {flete,vac,pz,pr,serv,total:serv+pr,com,neto:serv-com};}
const etaPortH=d=>d.dist/35;
function arriveAfter(startMs,driveH){let t=startMs,left=driveH*HR;if(!CLOSURE.on)return t+left;
 for(let i=0;i<30;i++){const d=new Date(t),h=d.getHours()+d.getMinutes()/60;
  if(h>=CLOSURE.from||h<CLOSURE.to){const n=new Date(t);if(h>=CLOSURE.from)n.setDate(n.getDate()+1);n.setHours(CLOSURE.to,0,0,0);t=n.getTime();continue;}
  const end=new Date(t);end.setHours(CLOSURE.from,0,0,0);const avail=end.getTime()-t;if(left<=avail)return t+left;left-=avail;t=end.getTime();}
 return t+left;}
function tripEta(t,d){const drive=kmOf(t)/d.speed,start=now()+(etaPortH(d)+1.5)*HR,arr=arriveAfter(start,drive);return {arrive:arr,wait:(arr-start)/HR-drive>0.05};}
function offersFor(t){return DRIVERS.filter(d=>S.online[d.id]).map(d=>({driverId:d.id,q:quote(t,d),eta:tripEta(t,d),etaPort:etaPortH(d)})).sort((a,b)=>a.etaPort-b.etaPort);}

// ---------- Geometría del mapa ilustrativo (360x240) ----------
function routePts(o,d){const a=PLACES[o],b=PLACES[d],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,pts=[];
 for(let i=0;i<=12;i++){const t=i/12;const bend=Math.sin(t*Math.PI)*L*.11+(i&&i<12?Math.sin(t*Math.PI*3)*5:0);pts.push([a.x+dx*t+nx*bend,a.y+dy*t+ny*bend]);}return pts;}
function pointAt(pts,p){const seg=[];let tot=0;for(let i=1;i<pts.length;i++){const l=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(l);tot+=l;}
 let target=Math.min(Math.max(p,0),1)*tot;for(let i=0;i<seg.length;i++){if(target<=seg[i]||i===seg.length-1){const r=seg[i]?Math.min(target/seg[i],1):0,A=pts[i],B=pts[i+1];
 return {x:A[0]+(B[0]-A[0])*r,y:A[1]+(B[1]-A[1])*r,ang:Math.atan2(B[1]-A[1],B[0]-A[0])*180/Math.PI};}target-=seg[i];}}
function prog(t){
 if(t.status==='DEVUELTO')return t.vacio==='puerto'?0:1;
 if(t.status==='ENTREGADO')return t.vacio==='puerto'?Math.max(0,t.toVacio/t.vacStart):1;
 if(t.status==='EN_TRANSITO')return t.progress;return 0;}
function geoAt(t){const a=PLACES[t.o],b=PLACES[t.d],p=prog(t);return {lat:a.lat+(b.lat-a.lat)*p,lng:a.lng+(b.lng-a.lng)*p};}
const tracking=t=>['ASIGNADO','EN_PUERTO','RECOGIDO','EN_TRANSITO','ENTREGADO'].includes(t.status)&&t.accepted;
const isDone=t=>t.status==='DEVUELTO'||t.status==='CANCELADO';
// Geocerca: distancia (km) al próximo punto de control
function distTo(t){switch(t.status){case 'ASIGNADO':return t.toPort;case 'EN_TRANSITO':return kmOf(t)*(1-t.progress);case 'ENTREGADO':return t.toVacio;default:return 0;}}
const inZone=t=>distTo(t)<=GEO+1e-6;
const kmTxt=k=>k<1?`${Math.round(k*1000)} m`:`${k.toFixed(1).replace('.',',')} km`;

// ---------- Estado (store en memoria) ----------
let S;
function newTrip(o){return Object.assign({status:'SOLICITADO',progress:0,events:[],evidences:[],offer:null,accepted:false,confirmed:false,lastGps:null,rating:0,notes:'',weight:'18500',
 review:{doc:'ok',driver:'confirmado',pay:'ok'},adminApproved:true,contact:[],chat:[],vacio:'patio',plazo:'consolidado',seg:{plan:'todo5',cif:150000000},pay:null,
 toPort:0,portStep:0,toVacio:0,vacStart:1,vacStep:0,pinSent:false,cita:null,silent:false,mine:false},o);}
function seed(){
 const n=now();
 const past=newTrip({id:'CG-1031',mine:true,client:CLIENT.company,o:'SPB',d:'BOG',ct:'20ST',date:isoDate(n-4*DAY),cno:genContainer(31),bl:'BUN2609871',seal:'PR-66012',weight:'14200',status:'DEVUELTO',progress:1,accepted:true,confirmed:true,rating:5,driverId:'d1',vacio:'patio',cita:n-4*DAY});
 past.pins={pickup:pinOf(past.id,0),delivery:pinOf(past.id,1)};

 const card=t=>`<button class="card" data-a="openTrip" data-v="${t.id}"><div class="row" style="justify-content:space-between"><span class="faint">${t.id} · ${CT[t.ct].label}</span>${statusBadge(t)}</div><div style="margin-top:8px">${routeLine(t)}</div>${miniSteps(t)}</button>`;
 return {tab:'home',html:`<div class="pad" style="padding-top:22px"><p class="muted" style="margin:0">Hola, ${CLIENT.name.split(' ')[0]}</p><h1 class="h1" style="margin:2px 0 14px">Tus contenedores</h1>
 <div class="card row" style="margin-bottom:14px;gap:12px"><span style="color:${c.verified==='ok'?'var(--ok)':'var(--warn)'}">${ic('shield',26)}</span><div class="grow"><b>${c.verified==='ok'?'Empresa verificada':'Verificación en revisión'}</b><div class="faint">Nivel ${c.level==='completo'?'completo':'básico'}${c.level==='basico'?` · hasta ${cop(KYCLIM)} asegurados por operación`:''}</div></div></div>
 <button class="btn btn-primary" data-a="newRequest">${ic('plus')}Nueva solicitud</button>

 <div class="section-t">Historial</div><div class="stack">${hist.map(card).join('')}</div></div>`};};

SCREENS.create=()=>{const f=S.form,c=checkContainer(f.cno),ft=formTrip(f),lvl=S.clients[CLIENT.company].level;
 const opt=(list,v)=>list.map(k=>`<option value="${k}" ${k===v?'selected':''}>${PLACES[k].name}</option>`).join('');
 const radio=(key,val,title,sub,price)=>`<button class="opt" data-a="setF" data-v="${key}|${val}" aria-pressed="${f[key]===val}"><span class="rd"></span><span class="grow"><b>${title}</b><br><span class="faint">${sub}</span></span>${price?`<span class="num" ${key==='plan'?`data-prima="${val}"`:''} style="font-weight:700;white-space:nowrap">${price}</span>`:''}</button>`;
 return {html:`${header('Nueva solicitud',{sub:'Paso 1 de 3'})}<div class="pad stack">
 <label class="field"><span>Terminal de recogida</span><select class="input" data-bind="o">${opt(ORIGINS,f.o)}</select></label>
 <label class="field"><span>Destino</span><select class="input" data-bind="d">${opt(DESTS,f.d)}</select></label>
 ${CLOSURE.on?`<div class="note">${ic('alert',14)} La vía Buga–Buenaventura está cerrada de ${CLOSURE.from-12} p. m. a ${CLOSURE.to} a. m. Las ofertas ya incluyen la espera.</div>`:''}
 <div class="field"><span>Tipo de contenedor</span><div class="ctsel" role="group">${Object.keys(CT).map(k=>`<button data-a="setCt" data-v="${k}" aria-pressed="${f.ct===k}">${contSVG(k)}${CT[k].short}<small>${k==='40HC'?'High Cube':'Standard'}</small></button>`).join('')}</div></div>
 <div class="grid2"><label class="field"><span>Fecha de recogida</span><input class="input" type="date" data-bind="date" value="${f.date}"></label><label class="field"><span>Peso (kg)</span><input class="input num" inputmode="numeric" data-bind="weight" value="${esc(f.weight)}"></label></div>
 <label class="field"><span>Número de contenedor</span><input class="input num" data-bind="cno" value="${esc(f.cno)}" autocapitalize="characters" spellcheck="false"><div class="hint ${c.ok?'ok':'bad'}" data-live="cnohint">${c.msg}</div></label>
 <div class="field"><span>Soporte de autorización</span><button class="card row" data-a="attachDoc" style="border-style:${f.doc?'solid':'dashed'}">${ic(f.doc?'check':'doc')}<span class="grow">${f.doc?`<b>${esc(f.doc.name)}</b><br><span class="faint">Toca para quitarlo</span>`:'<b>Adjuntar BL o carta de autorización</b><br><span class="faint">Simulado: no se sube ningún archivo</span>'}</span></button>
  <div class="hint">El consignatario del BL debe coincidir con tu empresa, o adjunta endoso o carta de autorización.</div></div>
 <div class="grid2"><label class="field"><span>BL</span><input class="input" data-bind="bl" value="${esc(f.bl)}"></label><label class="field"><span>Precinto</span><input class="input" data-bind="seal" value="${esc(f.seal)}"></label></div>
 <div class="field"><span>¿Dónde se devuelve el contenedor vacío?</span><div class="stack" style="margin-top:0">
  ${radio('vacio','patio',`Patio de la naviera en ${PLACES[f.d].city}`,'Más cerca y más barato',cop(vacioFee({...ft,vacio:'patio'})))}
  ${radio('vacio','puerto',`Puerto de ${PLACES[f.o].city}`,'Si la naviera lo exige',cop(vacioFee({...ft,vacio:'puerto'})))}</div></div>
 <div class="field"><span>Plazo del servicio</span><div class="stack" style="margin-top:0">
  ${radio('plazo','consolidado','Consolidado: 6 días','Entrega y devolución del vacío, sin costo extra','Incluido')}
  ${radio('plazo','expres','Exprés: 3 días','Prioridad en la asignación','+ '+cop(300000))}</div></div>
 <div class="field"><span>Seguro de la carga (obligatorio)</span>
  <input class="input num" data-bind="cif" inputmode="numeric" value="${esc(f.cif)}" placeholder="Valor de la mercancía (COP)"><div class="hint">Valor CIF de la mercancía. ${lvl==='basico'?`Nivel básico: máximo ${cop(KYCLIM)}.`:''}</div>
  <div class="stack" style="margin-top:10px">${Object.keys(SEG).map(k=>radio('plan',k,SEG[k].name,`Deducible ${SEG[k].ded}. ${SEG[k].cov}`,cop(prima({seg:{plan:k,cif:+f.cif||0}})))).join('')}</div></div>
 <label class="field"><span>Observaciones</span><textarea class="input" data-bind="notes" placeholder="Horario de la bodega, contacto en destino…">${esc(f.notes)}</textarea></label>
 ${S.formErr?`<div class="errbox">${S.formErr}</div>`:''}<button class="btn btn-primary" data-a="submitRequest">Ver ofertas</button></div>`};};

SCREENS.offers=({id})=>{const t=trip(id),list=offersFor(t);
 return {html:`${header('Ofertas',{sub:'Paso 2 de 3'})}<div class="pad">
 <div class="card" style="background:var(--surface-2)">${routeLine(t)}<div class="faint" style="margin-top:4px">${CT[t.ct].label} · ${kmOf(t)} km · recogida ${fmtD(t.date+'T12:00')} · vacío en ${t.vacio==='patio'?'patio':'puerto'} · ${t.plazo==='expres'?'exprés':'consolidado'}</div></div>
 <p class="muted" style="margin:16px 0 10px">${list.length?`${list.length} conductores conectados, ordenados por cercanía al puerto. Por tu seguridad, el nombre y la placa se muestran cuando ${BRAND} aprueba el servicio.`:'No hay conductores conectados ahora. Intenta de nuevo en unos minutos.'}</p>
 <div class="stack">${list.map(o=>{const d=drv(o.driverId);return `<div class="card offer"><div class="row"><span class="avatar">${initials(d.carrier)}</span><div class="grow"><div class="h3">${d.carrier}</div><div class="faint">Conductor verificado · <span class="stars">★ ${d.rating}</span> · ${d.trips} viajes</div></div></div>
  <div class="row" style="margin-top:14px;justify-content:space-between;align-items:flex-end"><div><div class="price num">${cop(o.q.total)}</div><div class="faint">Incluye vacío y seguro</div></div><span class="badge b-neutral">${d.tag}</span></div>
  <div class="faint" style="margin-top:10px">${ic('pin',14)} Llega al puerto en ${dur(o.etaPort)} · ${ic('clock',14)} entrega hacia el ${fmtDT(o.eta.arrive)}</div>${o.eta.wait?`<div class="faint" style="color:var(--warn)">Incluye la espera por el cierre nocturno de la vía</div>`:''}
  <button class="btn btn-primary btn-sm" style="width:100%;margin-top:14px" data-a="pickOffer" data-v="${t.id}|${d.id}">Seleccionar</button></div>`;}).join('')}</div></div>`};};

SCREENS.confirm=({id})=>{const t=trip(id),d=t.offer?drv(t.offer.driverId):null,q=t.offer.q;
 return {html:`${header('Confirmar transporte',{sub:'Paso 3 de 3'})}<div class="pad stack">
 <div class="card">${routeLine(t,20)}<div class="faint" style="margin:4px 0 12px">${PLACES[t.o].name} → ${PLACES[t.d].name}</div><dl class="kv"><dt>Contenedor</dt><dd>${CT[t.ct].label}</dd><dt>Número</dt><dd class="num">${esc(t.cno)}</dd><dt>BL / precinto</dt><dd>${esc(t.bl)} / ${esc(t.seal)}</dd><dt>Peso</dt><dd>${Number(t.weight).toLocaleString('es-CO')} kg</dd><dt>Recogida</dt><dd>${fmtD(t.date+'T12:00')}</dd><dt>Devolución del vacío</dt><dd>${esc(vacLabel(t))}</dd><dt>Plazo</dt><dd>${t.plazo==='expres'?'Exprés, 3 días':'Consolidado, 6 días'}</dd></dl></div>
 <div class="card"><div class="row"><span class="avatar">${initials(d.carrier)}</span><div class="grow"><div class="h3">${d.carrier}</div><div class="faint">Conductor verificado · ★ ${d.rating}</div></div></div><div class="divider"></div>${breakdown(t,q)}
  <div class="faint" style="margin-top:8px">Seguro: ${SEG[t.seg.plan].name}, deducible ${SEG[t.seg.plan].ded}, sobre ${cop(t.seg.cif)}.</div></div>
 <div class="card stack"><div class="row">${ic('lock',20)}<b>Pago protegido</b></div><div class="faint">${BRAND} retiene tu pago y solo lo libera al conductor cuando devuelve el contenedor vacío con comprobante.</div>
  <div class="faint"><b>Cancelación:</b> gratis antes de asignar conductor; 20 % del servicio después de asignado; no se puede cancelar cuando el contenedor ya salió del puerto.</div></div>
 <button class="btn btn-primary" data-a="payStart" data-v="${t.id}">Pagar ${cop(q.total)}</button></div>`};};

SCREENS.tracking=({id})=>{const t=trip(id),d=dOf(t),hl=clientHeadline(t),on=tracking(t)&&t.lastGps,nm=named(t),pinShow=t.accepted&&['ASIGNADO','EN_PUERTO','RECOGIDO','EN_TRANSITO'].includes(t.status);
 const canCancel=!isDone(t)&&['SOLICITADO','ASIGNADO','EN_PUERTO'].includes(t.status);
 const selfieOk=t.events.some(e=>e.ev==='SELFIE');
 return {tab:'ctrack',html:`${header('Viaje '+t.id,{sub:`${PLACES[t.o].city} → ${PLACES[t.d].city}`})}${mapSVG(t,250)}
 <div class="over"><div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="eta num" data-live="etabig">${hl.big}</div><div class="muted" data-live="etasmall">${hl.small}</div></div>${statusBadge(t)}</div>
 ${tracking(t)?`<div class="divider"></div><div class="live ${on?'':'off'}" data-live="gps">${ic('gps',15)}${on?'Ubicación en vivo · '+ago(t.lastGps):'Sin señal reciente'}</div>`:''}</div></div>
 <div class="pad stack">
 ${t.accepted||(t.offer&&t.confirmed)?`<div class="card"><div class="row"><span class="avatar">${t.accepted&&nm?initials(d.name):initials(d.carrier)}</span><div class="grow"><div class="h3">${t.accepted&&nm?d.name:'Conductor verificado'}</div><div class="faint">${d.carrier} · ${t.accepted&&nm?`placa ${d.plate}`:'placa visible al aprobar'}</div>${t.accepted&&nm?`<div class="faint">${d.vehicle}</div>`:''}</div></div>
  ${selfieOk?`<div style="margin-top:10px"><span class="badge b-ok">${ic('shield',13)}Identidad verificada con selfie al llegar al puerto</span></div>`:''}
  ${t.accepted?`<div class="row" style="margin-top:14px"><button class="btn btn-secondary btn-sm grow" data-a="callSheet" data-v="${t.id}">${ic('phone',18)}Llamar</button><button class="btn btn-secondary btn-sm grow" data-a="openChat" data-v="${t.id}">${ic('chat',18)}Chat</button></div>`:''}</div>`:''}
 ${pinShow?`<div class="card" style="border-color:var(--brand)"><div class="row">${ic('key' in I?'key':'lock',20)}<b>Tu PIN de entrega</b></div>${digits(t.pins.delivery)}<div class="faint">Díselo solo a la persona que recibe el contenedor. El conductor lo necesita para confirmar la entrega. ${BRAND} nunca te lo pedirá.</div></div>`:''}
 ${t.pay?`<div class="card row">${ic('wallet',22)}<div class="grow"><b>Pago ${t.pay.status==='liberado'?'liberado al conductor':t.pay.status==='retenido'?'retenido':t.pay.status}</b><div class="faint">${cop(t.pay.amount)} · ${esc(t.pay.method)}${t.pay.status==='retenido'?'. Se libera al devolver el vacío':''}</div></div></div>`:''}
 <div class="card"><div class="h3" style="margin-bottom:14px">Estado del viaje</div>${stepper(t)}</div>
 <div class="row" style="flex-wrap:wrap">${t.accepted&&!isDone(t)?`<button class="btn btn-secondary btn-sm grow" data-a="shareSheet" data-v="${t.id}">${ic('link',18)}Compartir seguimiento</button>`:''}<button class="btn btn-secondary btn-sm grow" data-a="goDetail" data-v="${t.id}">${ic('doc',18)}Historial y documentos</button></div>
 ${t.status==='SOLICITADO'&&!t.offer?`<button class="btn btn-primary" data-a="goOffers" data-v="${t.id}">Ver ofertas</button>`:''}
 ${t.status==='DEVUELTO'?`<button class="btn btn-primary" data-a="receipt" data-v="${t.id}">${ic('doc')}Ver comprobante y calificar</button>`:''}
 ${canCancel?`<button class="btn btn-secondary" style="color:var(--bad)" data-a="cancelSheet" data-v="${t.id}">Cancelar servicio</button>`:''}
 ${t.accepted&&!isDone(t)?`<button class="btn btn-secondary" data-a="msgs" data-v="${t.id}|cliente">${ic('help')}Hablar con ${BRAND}</button>`:''}
 </div>`};};

SCREENS.detail=({id})=>{const t=trip(id),tab=S.detailTab,d=dOf(t),q=t.offer?.q;
 const tabs=`<div class="chips" role="tablist">${[['hist','Historial'],['docs','Documentos']].map(([k,l])=>`<button class="chip" role="tab" aria-selected="${tab===k}" aria-pressed="${tab===k}" data-a="detailTab" data-v="${k}">${l}</button>`).join('')}</div>`;
 const hist=`<div class="card"><ul class="timeline">${[...t.events].reverse().map(e=>`<li><div class="row" style="justify-content:space-between"><b>${ST[e.status].label}</b><span class="faint num">${fmtDT(e.at)}</span></div><div class="faint" style="margin-top:2px">Por ${esc(e.by)} · ${ic('pin',12)} ${e.lat.toFixed(4)}, ${e.lng.toFixed(4)}${e.ev?` · evidencia: ${EVL[e.ev]}`:''}</div></li>`).join('')}</ul></div><p class="faint" style="margin:10px 4px 0">Cada cambio de estado guarda quién, cuándo, dónde y la evidencia.</p>`;

 <div class="section-t">Autorización del contenedor</div><div class="menu"><div class="mi">${ic('doc')}<span class="grow">${esc(t.doc?t.doc.name:'BL_'+t.bl+'.pdf')}<br><span class="faint">Consignatario: ${esc(t.client)}</span></span>${rvBadge(t.review.doc)}</div></div>

 ${q?`<div class="section-t">Seguro y pago</div><div class="card">${breakdown(t,q)}<div class="faint" style="margin-top:8px">Póliza: ${SEG[t.seg.plan].name} · deducible ${SEG[t.seg.plan].ded} · valor asegurado ${cop(t.seg.cif)}${t.pay?`<br>Pago: ${esc(t.pay.method)}, ${t.pay.status}`:''}</div></div>`:''}
 <div class="section-t">Evidencias (${t.evidences.length})</div>${t.evidences.length?`<div class="evgrid">${t.evidences.map(evTile).join('')}</div>`:`<div class="note">Selfie de llegada, recogida, entrega y devolución del vacío aparecerán aquí.</div>`}
 <div style="margin-top:16px"><button class="btn ${t.status==='DEVUELTO'?'btn-primary':'btn-secondary'}" data-a="receipt" data-v="${t.id}" ${t.status==='DEVUELTO'?'':'disabled'}>${ic('doc')}Ver comprobante</button>${t.status!=='DEVUELTO'?'<p class="faint" style="text-align:center">Disponible cuando se devuelva el vacío.</p>':''}</div>`;
 return {html:`${header('Detalle del viaje',{sub:t.id})}${tabs}<div class="pad" style="padding-top:8px">${tab==='hist'?hist:docs}</div>`};};

SCREENS.chat=({id})=>{const t=trip(id),me=S.mode==='client'?'cliente':'conductor',other=me==='cliente'?(named(t)?dOf(t).name:'Conductor'):CLIENT.name.split(' ')[0]+' (cliente)',open=!isDone(t);
 const msgs=t.chat.map(m=>`<div class="bub ${m.by===me?'me':m.by==='admin'?'adm':'them'}"><div class="faint">${m.by==='admin'?BRAND+' (soporte)':m.by===me?'Tú':esc(m.name)} · ${fmtT(m.at)}</div>${m.photo?`<div class="chatph">${photoSVG('CHAT',m.seed||3,m.at,m.lat||3.9,m.lng||-77)}</div>`:''}${m.text?esc(m.text):''}</div>`).join('')||`<div class="empty" style="padding:30px 10px">Aún no hay mensajes. Escribe para coordinar la entrega.</div>`;
 const quick=me==='conductor'?['Voy en camino','Ya llegué al punto','Tengo una demora de 30 min']:['Puede entregar a Mauricio','La bodega cierra a las 4 p. m.'];
 return {full:true,html:`${header('Chat · '+t.id,{sub:`Con ${esc(other)} · ${BRAND} puede ver esta conversación`})}
 <div class="screen chat" id="scr"><div class="note" style="margin-bottom:10px">${ic('lock',14)} Tus datos de contacto no se comparten. Si necesitas hablar, usa la llamada protegida.</div>${msgs}</div>
 ${open?`<div class="chatin"><div class="chips" style="padding:0 0 8px">${quick.map(q=>`<button class="chip" data-a="quickChat" data-v="${t.id}|${esc(q)}">${esc(q)}</button>`).join('')}</div><div class="row"><button class="iconbtn" data-a="chatPhoto" data-v="${t.id}" aria-label="Enviar foto">${ic('image')}</button><input class="input" id="chat-in" placeholder="Escribe un mensaje" autocomplete="off"><button class="iconbtn" style="background:var(--brand);color:var(--on-brand)" data-a="sendChat" data-v="${t.id}" aria-label="Enviar">${ic('send')}</button></div></div>`:'<div class="chatin faint" style="text-align:center">El chat se cierra al finalizar el servicio.</div>'}`};};

  render();toast(k==='SIN_SENAL'&&!t.silent?'GPS recuperado':'Alerta enviada a '+BRAND,'alert');},
 doStatus(next){const t=activeDriverTrip(),dr=S.draft,me=drv(S.driverId).name;let err='',ev=null;
  if(next==='EN_PUERTO'){ev='SELFIE';
   if(!inZone(t))err='Debes estar a menos de 300 m del terminal.';else if(!dr.selfie)err='Tómate la selfie.';
   else if(dr.selfieBad&&!t.selfieOk){addAlert(t,'SELFIE',`La selfie de llegada no coincide con la foto registrada de ${me}`);err=`No pudimos verificar tu identidad. Un operador de ${BRAND} te contactará.`;}}
  if(next==='RECOGIDO'){ev='RECOGIDA';const c=checkContainer(dr.cno);
   if(!t.pinSent)err='Aún no tienes PIN de retiro.';else if(dr.pin.trim()!==t.pins.pickup){t.pinTry=(t.pinTry||0)+1;err='El PIN de retiro no coincide.';if(t.pinTry===3)addAlert(t,'INCIDENCIA','3 intentos fallidos con el PIN de retiro');}
   else if(!dr.cno)err='Escribe el número del contenedor.';else if(!c.ok)err=c.msg+'.';else if(dr.cno.replace(/[\s-]/g,'').toUpperCase()!==t.cno)err=`El número no coincide con el de la solicitud (${t.cno}).`;
   else if(!dr.seal.trim())err='Escribe el número de precinto.';else if(!dr.photo)err='Toma la foto del contenedor.';}
  if(next==='ENTREGADO'){ev='ENTREGA';
   if(!inZone(t))err='Debes estar a menos de 300 m del destino.';else if(!t.pinOverride&&dr.pin.trim()!==t.pins.delivery){t.pinTry=(t.pinTry||0)+1;err='El PIN de entrega no coincide. Pídelo a quien recibe.';if(t.pinTry===3)addAlert(t,'INCIDENCIA','3 intentos fallidos con el PIN de entrega',{act:'pin'});}
   else if(!dr.receiver.trim())err='Escribe el nombre de quien recibe.';else if(!dr.photo)err='Toma la foto de entrega.';}
  if(next==='DEVUELTO'){ev='VACIO';if(!inZone(t))err='Debes estar a menos de 300 m del punto de devolución.';else if(!dr.eir.trim())err='Escribe el número del comprobante.';else if(!dr.photo)err='Toma la foto del comprobante.';}
  if(err){dr.err=err;render();document.getElementById('scr').scrollTop=1e5;return;}
  if(next==='RECOGIDO'&&dr.seal.trim()!==t.seal)t.seal=dr.seal.trim();
  if(next==='ENTREGADO'){t.progress=1;t.toVacio=t.vacio==='patio'?5:kmOf(t);t.vacStart=t.toVacio;t.vacStep=Math.max(t.vacStart/60,.05);t.pinTry=0;t._z=undefined;}
  pushEvent(t,next,me,ev);t.lastGps=now();
  const g=geoAt(t);
  if(next==='EN_PUERTO')t.evidences.push(Object.assign({},dr.selfie,{extra:'Verificación facial: coincide con el conductor registrado'}));
  if(next==='RECOGIDO')t.evidences.push(Object.assign({},dr.photo,{type:'RECOGIDA',extra:`Contenedor ${t.cno}, precinto ${t.seal}. PIN validado`}));
  if(next==='ENTREGADO')t.evidences.push(Object.assign({},dr.photo,{type:'ENTREGA',extra:`Recibe: ${dr.receiver}. PIN validado${dr.comment?'. '+dr.comment:''}`}));
  if(next==='DEVUELTO'){t.evidences.push(Object.assign({},dr.photo,{type:'VACIO',extra:`Comprobante ${dr.eir}`}));t.eir=dr.eir;t.pay.status='liberado';notify('admin',`${t.id} completo: pago de ${cop(t.offer.q.neto)} liberado a ${me}`);}
  const msg={EN_PUERTO:'El conductor llegó al puerto y verificó su identidad',RECOGIDO:'Tu contenedor fue recogido',EN_TRANSITO:'Tu contenedor va en camino',ENTREGADO:'Tu contenedor fue entregado con PIN',DEVUELTO:'Servicio completo: el vacío fue devuelto'}[next];
  notifyClient(t,`${msg} (${t.id})`);if(next==='EN_PUERTO')notify('admin',`${me} llegó al puerto (${t.id}). Envía el PIN de retiro`);
  S.draft=freshDraft();
  if(next==='DEVUELTO'){resetTo(['d-earnings']);toast(`Vacío devuelto. Se libera ${cop(t.offer.q.neto)} a tu cuenta`,'check');}
  else{stack().pop();render(true);toast(`Estado actualizado: ${ST[next].label}`,'check');}},
 noPin(id){const t=trip(id);addAlert(t,'INCIDENCIA','El receptor no tiene el PIN de entrega',{act:'pin'});notifyClient(t,`El conductor de ${t.id} no pudo validar tu PIN de entrega. ${BRAND} se comunica contigo.`);toast(`Aviso enviado a ${BRAND}. Espera instrucciones`,'alert');},
 earn(v){S.earn=v;render();},
 roadSheet(){sheet(`<div class="h2">Reportar vía</div><p class="muted">Tu reporte lo ven los demás conductores y ${BRAND}.</p>
  <label class="field"><span>Tipo</span><select class="input" id="rd-type">${['Congestión','Cierre','Restricción','Accidente','Derrumbe'].map(x=>`<option>${x}</option>`).join('')}</select></label>
  <label class="field" style="margin-top:10px"><span>Lugar</span><input class="input" id="rd-where" placeholder="Ej. Km 40, vía Buga – Buenaventura"></label>
  <label class="field" style="margin-top:10px"><span>Detalle</span><textarea class="input" id="rd-text"></textarea></label>
  <button class="btn btn-primary" style="margin-top:12px" data-a="roadAdd">Publicar</button>${cancelBtn}`);},
 roadAdd(){const w=document.getElementById('rd-where').value.trim(),x=document.getElementById('rd-text').value.trim();if(!w||!x){toast('Completa el lugar y el detalle','alert');return;}
  S.roads.push({id:'R'+(S.nextRoad++),type:document.getElementById('rd-type').value,where:w,text:x,by:drv(S.driverId).name,at:now(),votes:1});closeSheet();render();toast('Reporte publicado','check');},
 roadVote(id){const r=S.roads.find(x=>x.id===id);r.votes++;render();},
 incSheet(id){sheet(`<div class="h2">Reportar incidencia</div><p class="muted">${BRAND} lo recibe como alerta y te contacta.</p>
  <label class="field"><span>Tipo</span><select class="input" id="in-type">${['Falla mecánica','Retraso en el terminal','Accidente','Contenedor dañado o precinto roto','Otro'].map(x=>`<option>${x}</option>`).join('')}</select></label>
  <label class="field" style="margin-top:10px"><span>Detalle</span><textarea class="input" id="in-text"></textarea></label>
  <button class="btn btn-primary" style="margin-top:12px" data-a="incSend" data-v="${id}">Enviar</button>${cancelBtn}`);},
 incSend(id){const t=trip(id),x=document.getElementById('in-text').value.trim();if(!x){toast('Cuéntanos qué pasó','alert');return;}addAlert(t,'INCIDENCIA',`${document.getElementById('in-type').value}: ${x}`);notifyClient(t,`El conductor reportó una incidencia en ${t.id}. ${BRAND} la está atendiendo.`);closeSheet();toast('Incidencia enviada','check');},
 panicSheet(id){sheet(`<div class="h2" style="color:var(--bad)">Emergencia</div><p class="muted">Se envía tu ubicación en vivo a ${BRAND}, que te llama de inmediato y avisa al cliente y a las autoridades si es necesario. Úsalo solo en una emergencia.</p>
  <button class="btn btn-danger" data-a="panicSend" data-v="${id}">${ic('siren')}Enviar alerta de emergencia</button>${cancelBtn}`);},
 panicSend(id){const t=trip(id);addAlert(t,'PANICO','El conductor activó el botón de emergencia');notifyClient(t,`Alerta de seguridad en ${t.id}. ${BRAND} está en contacto con el conductor.`);closeSheet();toast(`Alerta enviada. ${BRAND} te llamará`,'siren');},
 cancelReq(id){sheet(`<div class="h2">Solicitar cancelación</div><p class="muted">Solo es posible antes de recoger el contenedor y ${BRAND} debe aprobarla con evidencia. Mientras tanto sigues asignado.</p>
  <label class="field"><span>Motivo</span><select class="input" id="cr-type">${['Falla mecánica','Documentos del vehículo','Emergencia personal','Cierre de la vía','Otro'].map(x=>`<option>${x}</option>`).join('')}</select></label>
  <label class="field" style="margin-top:10px"><span>Evidencia o explicación</span><textarea class="input" id="cr-text" placeholder="Describe lo ocurrido; en producción adjuntas foto"></textarea></label>
  <button class="btn btn-primary" style="margin-top:12px" data-a="cancelReqSend" data-v="${id}">Enviar solicitud</button>${cancelBtn}`);},
 cancelReqSend(id){const t=trip(id),x=document.getElementById('cr-text').value.trim();if(!x){toast('Agrega la evidencia','alert');return;}
  t.cancelReq=true;addAlert(t,'CANCELACION',`${document.getElementById('cr-type').value}. ${x}`);closeSheet();toast('Solicitud enviada. Sigues asignado hasta que sea aprobada','check');},
 privacy(){sheet(`<div class="h2">Privacidad y ubicación</div><p class="muted">En cumplimiento de la Ley 1581 de 2012, ${BRAND} solicita tu autorización para tratar datos personales y, en el caso del conductor, para usar la ubicación del celular.</p>
  <div class="menu"><div class="mi">${ic('gps')}<span class="grow">La ubicación se registra solo durante viajes activos</span></div><div class="mi">${ic('lock')}<span class="grow">Cada rol ve solo los datos mínimos que necesita</span></div><div class="mi">${ic('doc')}<span class="grow">Todo cambio de estado queda en un registro de auditoría</span></div></div>
  <button class="btn btn-secondary" style="margin-top:14px" data-a="closeSheet">Entendido</button>`);},
 fake(msg){toast(msg,'alert');},
 closeSheet,
 closeSheetBg(_,el,e){if(e.target===el)closeSheet();},
 msgs(v){const [id,role]=v.split('|');msgSheet(id,role);},
 sendTicket(v){const [id,role]=v.split('|'),type=document.getElementById('tk-type').value,text=document.getElementById('tk-text').value.trim();
  if(!text){toast('Escribe el mensaje antes de enviarlo','alert');return;}
  const who=role==='cliente'?`${CLIENT.name} (${CLIENT.company.split(' ').slice(0,2).join(' ')})`:drv(S.driverId).name;
  S.tickets.push({id:'T-'+(S.nextTicket++),tripId:id,from:role,who,type,text,at:now(),status:'abierto',msgs:[]});
  notify('admin',`${role==='cliente'?'Consulta del cliente':'Mensaje del conductor'} en ${id}: ${type}`);msgSheet(id,role);toast(`Enviado. ${BRAND} te responde por aquí.`,'check');},
});

// ---------- Render ----------
let lastKey='';
function render(nav){['client','driver'].forEach(m=>document.getElementById('seg-'+m).setAttribute('aria-pressed',String(S.mode===m)));
 const c=cur(),key=S.mode+c.s+JSON.stringify(c.p||{});const scr=document.getElementById('scr');const keep=!nav&&key===lastKey&&scr?scr.scrollTop:0;
 const out=SCREENS[c.s](c.p||{});
 document.getElementById('app').innerHTML=out.full?out.html:`<div class="screen" id="scr">${out.html}</div>${out.tab?tabbar(out.tab):''}`;
 const ns=document.getElementById('scr');if(ns)ns.scrollTop=c.s==='chat'?1e6:keep;lastKey=key;}
function showNotices(){if((S.mode==='client'&&!S.clientLogged)||(S.mode==='driver'&&!S.driverLogged))return;const un=S.notices.filter(n=>!n.seen&&n.to===S.mode);if(!un.length)return;un.forEach(n=>n.seen=true);
 toast(un.length>1?`${un.at(-1).text} (+${un.length-1} más)`:un[0].text,'bell');}

// Simulación en vivo (1 s)
function tick(){
 for(const t of S.trips){if(!t.accepted||isDone(t))continue;
  if(!t.silent)t.lastGps=now();
  if(t.status==='ASIGNADO')t.toPort=Math.max(.2,t.toPort-t.portStep);
  else if(t.status==='EN_TRANSITO')t.progress=Math.min(.9995,t.progress+.009);
  else if(t.status==='ENTREGADO')t.toVacio=Math.max(.2,t.toVacio-t.vacStep);
  const z=inZone(t);
  if(t._z!==undefined&&t._z!==z&&S.mode==='driver'&&activeDriverTrip()===t){if(z)toast('Llegaste a la zona (menos de 300 m)','pin');if(['d-active','d-status'].includes(cur().s)){render();}}
  t._z=z;}
 persist();showNotices();
 const c=cur(),t=c.p&&c.p.id?trip(c.p.id):(S.mode==='driver'?activeDriverTrip():null);if(!t||c.s==='chat')return;
 liveMap('',t);
 const g=document.querySelector('[data-live="gps"]');if(g&&tracking(t))g.innerHTML=ic('gps',15)+(t.silent?(S.mode==='driver'?'Sin señal de GPS':'Sin señal reciente'):(S.mode==='driver'?'GPS activo · ':'Ubicación en vivo · ')+ago(t.lastGps));
 if(c.s==='tracking'){const hl=clientHeadline(t),b=document.querySelector('[data-live="etabig"]'),s=document.querySelector('[data-live="etasmall"]');if(b)b.textContent=hl.big;if(s)s.textContent=hl.small;}
 if(S.mode==='driver'&&t===activeDriverTrip()){const ds=document.querySelector('[data-live="dstop"]');
  if(ds){if(['ASIGNADO','ENTREGADO'].includes(t.status))ds.textContent=`A ${kmTxt(distTo(t))} · ${dur(distTo(t)/Math.min(drv(S.driverId).speed,40))}`;else if(t.status==='EN_TRANSITO'){const e=etaInfo(t);ds.textContent=`Faltan ${Math.round(e.km)} km · ${dur(e.h)}`;}}
  const gs=document.querySelector('[data-live="geo"] span');if(gs){const lbl={ASIGNADO:'terminal',EN_TRANSITO:'destino',ENTREGADO:'punto de devolución'}[t.status]||'punto';gs.textContent=inZone(t)?`Estás en la zona del ${lbl}.`:`Estás a ${kmTxt(distTo(t))} del ${lbl}. Para confirmar debes estar a menos de 300 m.`;}}}
// Eventos
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.dataset.a==='closeSheetBg'&&e.target!==el)return;const fn=A[el.dataset.a];if(!fn)return;
 if(el.tagName!=='INPUT')e.preventDefault();fn(el.dataset.v,el,e);persist();});
document.addEventListener('input',e=>{const el=e.target;
 if(el.dataset.bind){S.form[el.dataset.bind]=el.value;
  if(el.dataset.bind==='cif')document.querySelectorAll('[data-prima]').forEach(s=>s.textContent=cop(prima({seg:{plan:s.dataset.prima,cif:+S.form.cif||0}})));
  if(el.dataset.bind==='cno'){const c=checkContainer(el.value),h=document.querySelector('[data-live="cnohint"]');h.textContent=c.msg;h.className='hint '+(c.ok?'ok':'bad');}}
 if(el.dataset.draft){S.draft[el.dataset.draft]=el.value;if(el.dataset.draft==='cno'){const c=checkContainer(el.value),h=document.querySelector('[data-live="dcnohint"]');h.textContent=el.value?c.msg:'';h.className='hint '+(el.value?(c.ok?'ok':'bad'):'');}}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.bind&&el.tagName==='SELECT'){S.form[el.dataset.bind]=el.value;render();}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();
 if(e.key==='Enter'&&e.target.id==='chat-in'){const b=document.querySelector('[data-a="sendChat"]');if(b)b.click();}});

//+' · Prototipo';document.getElementById('brand-tag').textContent=BRAND+' · prototipo';




// Sincronización con la plataforma admin (mismo navegador)
let lastSig='';
window.addEventListener('storage',e=>{if(e.key!==SKEY)return;loadShared();const s=sig();if(s===lastSig)return;lastSig=s;
 if(S.mode==='driver')autoDriver();const ae=document.activeElement;if(!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)))render();showNotices();});
document.title=BRAND+' · App';document.getElementById('brand-tag').textContent=BRAND+' · app cliente y conductor';
S=seed();if(loadShared()){S.form=freshForm(S.nextId);}else persist();lastSig=sig();render(true);
setTimeout(()=>{if(cur().s==='splash')resetTo(['role']);},2200);
setInterval(tick,1000);

</script>
